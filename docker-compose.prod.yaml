services:
  nginx:
    image: nginx:alpine
    container_name: bingol-plus-nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt sertifikaları — projeye eklenmez, host'ta certbot ile oluşturulur
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot

    depends_on:
      - app

volumes:
  certbot_www:
